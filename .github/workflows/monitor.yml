name: Security Keyword Monitor

on:
  schedule:
    - cron: '0 * * * *'      # Runs hourly
    - cron: '30 2 * * *'     # Runs daily at 08:00 AM IST (02:30 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select scan mode'
        required: true
        default: 'hourly'
        type: choice
        options:
          - hourly
          - daily

concurrency:
  group: news-monitor-state
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 1: Runs hourly on the 0-minute cron or on hourly manual dispatch
      - name: Run Sikka / Local Hourly Monitor
        if: (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'hourly')
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py --mode hourly

      # Step 2: Runs daily at 08:00 AM IST cron or on daily manual dispatch
      - name: Run CISF / National Daily Monitor
        if: (github.event_name == 'schedule' && github.event.schedule == '30 2 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily')
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py --mode daily

      # Step 3: Commit updated state.json
      - name: Commit and Push State Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add state.json
          git diff-index --quiet HEAD || (git commit -m "Update state.json [skip ci]" && git push origin HEAD:main)
